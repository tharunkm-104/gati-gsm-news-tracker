name: Daily sentiment update

on:
  schedule:
    - cron: "30 5 * * 1-5"   # 5:30 UTC = ~11:00 AM IST, weekdays
  workflow_dispatch: {}       # lets you click "Run workflow" manually to test

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/fetch_and_process.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: Commit updated data
        run: |
          git config user.name "gati-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Data update: $(date +'%Y-%m-%d')"
          git push
