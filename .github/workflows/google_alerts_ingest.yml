name: Google Alerts Ingest (Gemini tagging)

on:
  schedule:
    # 5:30 AM UTC = 11:00 AM IST
    - cron: "30 5 * * *"
  workflow_dispatch: {}  # Allows manual runs from the Actions tab

permissions:
  contents: write  # Required to commit the updated CSV back to the repository

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements-alerts.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-alerts.txt

      - name: Run Google Alerts ingest + Gemini tagging
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/google_alerts_ingest.py

      - name: Commit updated CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Google Alerts ingest auto-update"
          file_pattern: "data/google_alerts_items.csv"
